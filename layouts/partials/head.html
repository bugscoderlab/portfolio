<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }}{{ end }}</title>
<meta name="description" content="{{ site.Params.description }}">
<meta name="author" content="{{ site.Params.name }}">
<link rel="canonical" href="{{ .Permalink }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.Title }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta name="twitter:card" content="summary">

<meta name="theme-color" content="#fbfbfa">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">

{{/* Resolve the theme before first paint (no flash). JS can override it later;
     with JS disabled the site simply renders in light mode. */}}
<script>
(function () {
  var d = document.documentElement;
  d.classList.add('js');
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch (e) {}
  if (stored !== 'light' && stored !== 'dark') {
    stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  d.setAttribute('data-theme', stored);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', stored === 'dark' ? '#0c0c0d' : '#fbfbfa');
})();
</script>

<link rel="preload" href="{{ "fonts/Geist-Variable.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ "fonts/GeistMono-Variable.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>

{{ $css := resources.Get "css/style.css" | minify | fingerprint "sha384" }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
